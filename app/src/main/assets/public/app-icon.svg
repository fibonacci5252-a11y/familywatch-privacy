<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient (Cerulean Azure to Midnight Abyss) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02A9FE" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#091E3A" />
    </linearGradient>

    <!-- Sun Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Sun Core Gradient -->
    <linearGradient id="sunCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Frosted Glass Cloud Gradient -->
    <linearGradient id="cloudGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#E0F2FE" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.75" />
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Raindrop Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#001830" flood-opacity="0.55" />
    </filter>

    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Frosted Rim Clip -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="118" ry="118" />
    </clipPath>
  </defs>

  <!-- Base App Icon Squircle Frame -->
  <rect x="0" y="0" width="512" height="512" rx="118" ry="118" fill="url(#bgGradient)" />

  <!-- Inner Ambient Shimmer & Atmospheric Isobar Waves -->
  <g clip-path="url(#squircleClip)" opacity="0.32">
    <circle cx="256" cy="180" r="280" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 14" />
    <circle cx="256" cy="180" r="210" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25" />
    <circle cx="256" cy="180" r="140" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2" />
  </g>

  <!-- 1. Glowing Sun with Corona -->
  <g transform="translate(320, 150)">
    <!-- Sun Halo -->
    <circle cx="0" cy="0" r="110" fill="url(#sunGlow)" />
    <!-- Sun Core -->
    <circle cx="0" cy="0" r="54" fill="url(#sunCore)" filter="url(#softShadow)" />
    <!-- Subtle Sun Flare Rays -->
    <line x1="0" y1="-74" x2="0" y2="-62" stroke="#FDE047" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <line x1="52" y1="-52" x2="43" y2="-43" stroke="#FDE047" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <line x1="74" y1="0" x2="62" y2="0" stroke="#FDE047" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <line x1="52" y1="52" x2="43" y2="43" stroke="#FDE047" stroke-width="5" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- 2. Volumetric Frosted Glass Rain Cloud -->
  <g filter="url(#softShadow)" transform="translate(35, 30)">
    <!-- Cloud Main Silhouette -->
    <path
      d="M190 320 L350 320 C388 320 418 290 418 252 C418 218 392 190 360 186 C354 135 311 96 258 96 C214 96 177 124 163 164 C157 162 150 161 144 161 C108 161 78 190 78 226 C78 234 80 242 83 249 C60 262 45 287 45 316 C45 356 78 388 118 388 L340 388 C380 388 412 356 412 316"
      fill="url(#cloudGlass)"
    />

    <!-- Internal Cloud Volume Highlights -->
    <ellipse cx="258" cy="180" rx="65" ry="50" fill="#FFFFFF" opacity="0.5" />
    <ellipse cx="140" cy="245" rx="42" ry="35" fill="#FFFFFF" opacity="0.45" />
    <ellipse cx="340" cy="240" rx="48" ry="40" fill="#FFFFFF" opacity="0.35" />
  </g>

  <!-- 3. Dynamic Electric Lightning Bolt -->
  <g filter="url(#boltGlow)" transform="translate(230, 260)">
    <polygon
      points="28,-10 -15,55 8,55 -22,125 45,45 15,45"
      fill="url(#boltGrad)"
      stroke="#FFFFFF"
      stroke-width="2.5"
      stroke-linejoin="round"
    />
  </g>

  <!-- 4. Luminous Rain Drops -->
  <g transform="translate(130, 395)" opacity="0.9">
    <!-- Drop 1 -->
    <line x1="0" y1="0" x2="-10" y2="24" stroke="url(#rainGrad)" stroke-width="5" stroke-linecap="round" />
    <!-- Drop 2 -->
    <line x1="50" y1="5" x2="40" y2="30" stroke="url(#rainGrad)" stroke-width="5.5" stroke-linecap="round" />
    <!-- Drop 3 -->
    <line x1="190" y1="2" x2="180" y2="28" stroke="url(#rainGrad)" stroke-width="5" stroke-linecap="round" />
    <!-- Drop 4 -->
    <line x1="240" y1="12" x2="230" y2="35" stroke="url(#rainGrad)" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- 5. Glass Edge Rim & Border Reflection -->
  <rect
    x="2"
    y="2"
    width="508"
    height="508"
    rx="116"
    ry="116"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-opacity="0.35"
  />
  <rect
    x="6"
    y="6"
    width="500"
    height="250"
    rx="112"
    ry="112"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1.5"
    stroke-opacity="0.2"
  />
</svg>
